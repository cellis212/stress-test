<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="refresh" content="2;url=https://alphaexmachina.app/" />
    <link rel="canonical" href="https://alphaexmachina.app/" />
    <title>Alpha ex Machina has moved</title>
    <script>
      const previous = new URL(window.location.href)
      const destination = new URL('https://alphaexmachina.app/')
      destination.pathname = previous.pathname.replace(/^\/stress-test(?=\/|$)/, '') || '/'
      destination.search = previous.search
      destination.hash = previous.hash
      window.location.replace(destination.href)
    </script>
    <style>
      html { color-scheme: dark; background: #111a20; color: #f2f1e9; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { box-sizing: border-box; width: min(100%, 40rem); padding: 2rem; }
      h1 { font-size: clamp(1.7rem, 5vw, 2.5rem); line-height: 1.2; }
      p { line-height: 1.6; }
      a { color: #f0c575; }
    </style>
  </head>
  <body>
    <main>
      <h1>Alpha ex Machina has moved</h1>
      <p>Opening the new site. <a href="https://alphaexmachina.app/">Continue to Alpha ex Machina</a>.</p>
    </main>
  </body>
</html>
